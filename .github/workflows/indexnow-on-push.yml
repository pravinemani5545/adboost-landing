name: IndexNow on deploy

# On every push to main that changes the site, wait until Vercel serves this
# exact commit (/build.txt), then submit only what changed (health plan T3):
# sitemap URLs whose lastmod is today (UTC), plus redirect sources this push
# added or changed in vercel.json. A hub's lastmod follows its newest child,
# so hubs of newly live pages are included by the same rule.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      since:
        description: 'Submit sitemap URLs with lastmod on or after this date (YYYY-MM-DD). Default: today (UTC).'
        required: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix the submission date before waiting
        run: echo "SINCE=${INPUT_SINCE:-$(date -u +%F)}" >> "$GITHUB_ENV"
        env:
          INPUT_SINCE: ${{ github.event.inputs.since }}

      - name: Wait for this commit to be live
        run: bash scripts/wait-for-deploy.sh
        env:
          WANT_SHA: ${{ github.sha }}

      - name: Submit changed URLs to IndexNow
        run: |
          REDIRECTS=""
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "$BEFORE:vercel.json" 2>/dev/null; then
            # Exact (non-pattern) redirect sources whose destination is new or changed.
            REDIRECTS=$(jq -rn --argjson old "$(git show "$BEFORE:vercel.json")" --argjson new "$(cat vercel.json)" '
              ($old.redirects | map({key: .source, value: .destination}) | from_entries) as $o
              | $new.redirects[]
              | select(.has == null and (.source | test("[:()*]") | not))
              | select($o[.source] != .destination)
              | "https://www.adboost.health" + .source')
          fi
          bash scripts/indexnow.sh "$SINCE" $REDIRECTS
        env:
          BEFORE: ${{ github.event.before }}
