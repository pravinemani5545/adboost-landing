name: Scheduled publish

# Rebuilds production Tue and Thu at 12:00 UTC (8:00 Toronto in EDT, 7:00 in
# EST) so blog posts whose pubDate has arrived and pages whose pages.json
# `publish` date has arrived go live, then submits only what changed to
# IndexNow (health plan T3). The file keeps its old name so existing
# `gh workflow run friday-publish.yml` calls still work; there is no Friday run.
on:
  schedule:
    - cron: '0 12 * * 2,4'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Vercel production rebuild
        run: |
          echo "BUILT_AFTER=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "SINCE=$(date -u +%F)" >> "$GITHUB_ENV"
          curl -sf -X POST "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      - name: Wait for the rebuild to go live
        run: bash scripts/wait-for-deploy.sh

      - name: Submit changed URLs to IndexNow
        run: bash scripts/indexnow.sh "$SINCE"
