name: Friday blog publish

# Rebuilds the site every Friday so future-dated posts whose pubDate has
# arrived get picked up by the publish-date gate (src/lib/blog.ts).
on:
  schedule:
    # Fridays 12:00 UTC = 8:00 AM Toronto (EDT)
    - cron: '0 12 * * 5'
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production rebuild
        run: curl -sf -X POST "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      - name: Wait for deploy to propagate
        run: sleep 180

      - name: Ping IndexNow (Bing/Copilot/DuckDuckGo/Yandex)
        run: |
          curl -sf -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"www.adboost.health","key":"70b8bdc92dc75dde445e7495e95258f2","keyLocation":"https://www.adboost.health/70b8bdc92dc75dde445e7495e95258f2.txt","urlList":["https://www.adboost.health/blog/","https://www.adboost.health/sitemap-index.xml"]}' || true
